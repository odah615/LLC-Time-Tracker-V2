<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch setter patch error:', e);
        }
      })();
    </script>
